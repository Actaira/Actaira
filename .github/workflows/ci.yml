# CI: the single required check of main is the job `check` (branch protection
# in docs/estado/branch-protection.json, the security boundary of main, ADR
# 0000). It runs exactly `make check`, the same gate as every step and the Stop
# hook. Actions are pinned by commit SHA, with their release in a comment.
# scripts/harness/tests/ci_test.sh compares every line that is not a comment
# with the reviewed one: GitHub takes a skipped job as a success even when its
# check is required, so an `if:` would merge without running anything (F-0014).
# Syntax: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# Skipped jobs: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the secret scan and the attribution check read every commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check
